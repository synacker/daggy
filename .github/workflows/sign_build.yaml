name: Build signing artefacts
on: 
  workflow_call:
    inputs:
      sign:
        description: 'sign policy'
        type: string
        required: true

jobs:   
  win-x64-apponly-build:
    runs-on: windows-2025-vs2026
    permissions:
      id-token: write
      contents: read
      checks: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Install WiX
        run: dotnet tool install --global wix

      - name: Accept eula for WiX
        run: wix eula accept wix7
      
      - name: Install WiX UI extension
        run: wix extension add --global WixToolset.UI.wixext

      - uses: ./.github/actions/enable_python
      - uses: ./.github/actions/conan_build
        with:
          profile: win-msvc195_x64_static
          args: -o daggy/*:apponly=True
      
      - uses: ./.github/actions/tests
        with:
          testdir: build
          name: win-msvc195_x64_static tests
   
      - uses: ./.github/actions/deploy_with_sign
        with:
          builddir: build
          artifact: win-msvc195_x64_static
          sign: ${{inputs.sign}}
          signeddir: build/signed
          token: ${{secrets.SIGNPATH_API_TOKEN}}